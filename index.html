<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Optical Notes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 3rem;
    }

    p {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      transition: 0.2s ease;
      border: 1px solid #334155;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #60a5fa;
    }

    .card a {
      text-decoration: none;
      color: #f8fafc;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .card span {
      display: block;
      margin-top: 10px;
      color: #94a3b8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>Optical Notes</h1>
  <p>Quick access to all summary pages</p>

  <div class="grid">

    <div class="card">
      <a href="./SUMMARY1.html">SUMMARY1</a>
      <span>Open notes</span>
    </div>

    <div class="card">
      <a href="./SUMMARY2.html">SUMMARY2</a>
      <span>Open notes</span>
    </div>

    <div class="card">
      <a href="./NETWORKING.html">NETWORKING</a>
      <span>Open notes</span>
    </div>

    <div class="card">
      <a href="./SECURITY.html">SECURITY</a>
      <span>Open notes</span>
    </div>

  </div>

</body>
</html>
